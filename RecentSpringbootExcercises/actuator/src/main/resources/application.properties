spring.application.name=actuator

# Expose the endpoints used in this example.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,scheduledtasks,beans,mappings,conditions,greeting

# Show health details for this learning example.
management.endpoint.health.show-details=always

# Values shown by /actuator/info.
info.app.name=Actuator Demo
info.app.description=Example Spring Boot application with Actuator
info.app.version=1.0.0

# Add the application name as a tag on recorded metrics.
